<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Emerald / Currency Green Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Glow Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Bill/Receipt Base Gradient -->
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5" />

  <!-- Main Content Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- LEFT HALF OF THE BILL (Slanted Left) -->
    <g transform="translate(244, 256) rotate(-9) translate(-244, -256)">
      <!-- Left Bill Body -->
      <path d="M 140 120 
               L 240 120 
               L 240 380 
               L 220 392 L 200 380 L 180 392 L 160 380 L 140 392 Z" fill="url(#billGrad)" />

      <!-- Content Lines (Simulated Text & Data) -->
      <rect x="160" y="150" width="60" height="10" rx="5" fill="#94A3B8" />
      <rect x="160" y="175" width="40" height="8" rx="4" fill="#CBD5E1" />
      
      <rect x="160" y="210" width="55" height="8" rx="4" fill="#CBD5E1" />
      <rect x="160" y="230" width="45" height="8" rx="4" fill="#CBD5E1" />
      <rect x="160" y="250" width="50" height="8" rx="4" fill="#CBD5E1" />
      
      <line x1="160" y1="280" x2="220" y2="280" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 3" />
      
      <!-- Currency Badge / Split Highlight Left -->
      <rect x="160" y="305" width="60" height="24" rx="6" fill="#10B981" fill-opacity="0.15" />
      <rect x="170" y="313" width="40" height="8" rx="4" fill="#059669" />
    </g>

    <!-- RIGHT HALF OF THE BILL (Slanted Right) -->
    <g transform="translate(268, 256) rotate(9) translate(-268, -256)">
      <!-- Right Bill Body -->
      <path d="M 272 120 
               L 372 120 
               L 372 392 
               L 352 380 L 332 392 L 312 380 L 292 392 L 272 380 Z" fill="url(#billGrad)" />

      <!-- Content Lines (Simulated Text & Data) -->
      <rect x="292" y="150" width="50" height="10" rx="5" fill="#94A3B8" />
      <rect x="292" y="175" width="60" height="8" rx="4" fill="#CBD5E1" />
      
      <rect x="292" y="210" width="45" height="8" rx="4" fill="#CBD5E1" />
      <rect x="292" y="230" width="55" height="8" rx="4" fill="#CBD5E1" />
      <rect x="292" y="250" width="40" height="8" rx="4" fill="#CBD5E1" />

      <line x1="292" y1="280" x2="352" y2="280" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 3" />

      <!-- Currency Badge / Split Highlight Right -->
      <rect x="292" y="305" width="60" height="24" rx="6" fill="#06B6D4" fill-opacity="0.15" />
      <rect x="302" y="313" width="40" height="8" rx="4" fill="#0891B2" />
    </g>

    <!-- CENTRAL LIGHTNING / SPLIT SLASH (Dynamic Energy) -->
    <!-- Glow Backdrop -->
    <path d="M 278 85 L 212 250 L 288 240 L 222 425 L 248 425 L 308 265 L 234 275 L 298 85 Z" fill="url(#emeraldGrad)" opacity="0.4" filter="url(#glow)" />
    
    <!-- Sharp Foreground Slash -->
    <path d="M 272 90 L 218 245 L 282 235 L 228 420 L 242 420 L 296 270 L 232 280 L 290 90 Z" fill="url(#cyanGrad)" />

    <!-- SPLIT / SPARK DROPS ("SPILL" EFFECT) -->
    <circle cx="195" cy="110" r="7" fill="#34D399" filter="url(#glow)" />
    <circle cx="320" cy="405" r="6" fill="#22D3EE" filter="url(#glow)" />
    <circle cx="150" cy="290" r="5" fill="#34D399" />
    <circle cx="365" cy="210" r="5" fill="#22D3EE" />

    <!-- CENTER CURRENCY SYMBOL BADGE (Floating Anchor) -->
    <g transform="translate(256, 256)" filter="url(#glow)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="42" fill="#0F172A" stroke="url(#emeraldGrad)" stroke-width="4" />
      <!-- Inner Glow Fill -->
      <circle cx="0" cy="0" r="34" fill="url(#emeraldGrad)" opacity="0.2" />
      <!-- Stylized 'S' / Dollar / Split Icon in Center -->
      <path d="M -8 -16 C -8 -16 -1 -21 7 -16 C 15 -11 11 -1 1 3 C -9 7 -13 17 -5 23 C 3 29 11 23 11 23" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <line x1="0" y1="-24" x2="0" y2="31" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>
    
  </g>
</svg>